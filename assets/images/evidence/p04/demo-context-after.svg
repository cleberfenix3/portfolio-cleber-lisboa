<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="100%" height="100%" fill="#0F1623"/>
<rect x="34" y="30" width="1132" height="700" rx="18" fill="none" stroke="#2B3546" stroke-width="2"/>
<text x="70" y="82" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#D6B35A">DEMONSTRAÇÃO AUTORAL</text>
<text x="70" y="132" font-family="Manrope,Arial,sans-serif" font-size="38" font-weight="800" fill="#F5F6F8">Aplicação profissional — priorização de uma intervenção</text>
<text x="70" y="168" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#42D3AA">O mesmo conteúdo orienta uma decisão de planejamento</text>
<line x1="70" y1="190" x2="1130" y2="190" stroke="#2B3546" stroke-width="2"/>
<rect x="70" y="228" width="1060" height="114" rx="14" fill="#172131" stroke="#2B3546"/>
<text x="94" y="262" font-family="Manrope,Arial,sans-serif" font-size="22" font-weight="800" fill="#D6B35A">Situação</text>
<text x="94" y="296" font-family="Inter,Arial,sans-serif" font-size="20" fill="#F5F6F8">Uma equipe municipal precisa escolher entre três espaços para uma intervenção:</text>
<text x="94" y="328" font-family="Inter,Arial,sans-serif" font-size="20" fill="#F5F6F8">pátio escolar asfaltado, avenida comercial sem árvores ou praça com pouca sombra.</text>
<rect x="70" y="360" width="1060" height="114" rx="14" fill="#172131" stroke="#2B3546"/>
<text x="94" y="394" font-family="Manrope,Arial,sans-serif" font-size="22" font-weight="800" fill="#D6B35A">Critérios de análise</text>
<text x="94" y="428" font-family="Inter,Arial,sans-serif" font-size="20" fill="#F5F6F8">Combinar temperatura, permanência de pessoas, sombreamento, vulnerabilidade social</text>
<text x="94" y="460" font-family="Inter,Arial,sans-serif" font-size="20" fill="#F5F6F8">e viabilidade de manutenção antes de definir a prioridade de intervenção.</text>
<rect x="70" y="492" width="1060" height="80" rx="14" fill="#172131" stroke="#2B3546"/>
<text x="94" y="526" font-family="Manrope,Arial,sans-serif" font-size="22" font-weight="800" fill="#D6B35A">Decisão pedagógica</text>
<text x="94" y="560" font-family="Inter,Arial,sans-serif" font-size="20" fill="#F5F6F8">O conceito deixa de ser apenas explicado e passa a apoiar análise profissional.</text>
<text x="70" y="704" font-family="Inter,Arial,sans-serif" font-size="15" fill="#AAB2C0">Material demonstrativo autoral — Portfólio de Cleber Lisboa</text>
</svg>