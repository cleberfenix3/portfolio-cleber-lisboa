<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="100%" height="100%" fill="#F7F7F3"/>
<rect x="34" y="30" width="1132" height="700" rx="18" fill="none" stroke="#D9DEE7" stroke-width="2"/>
<text x="70" y="82" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#D6B35A">DEMONSTRAÇÃO AUTORAL</text>
<text x="70" y="132" font-family="Manrope,Arial,sans-serif" font-size="38" font-weight="800" fill="#1F2937">Ilhas de calor em áreas urbanas</text>
<text x="70" y="168" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#42D3AA">Trecho expositivo do material-base</text>
<line x1="70" y1="190" x2="1130" y2="190" stroke="#D9DEE7" stroke-width="2"/>
<text x="70" y="236" font-family="Inter,Arial,sans-serif" font-size="23" fill="#1F2937">Superfícies pavimentadas e edificações podem armazenar calor durante o dia.</text>
<text x="70" y="274" font-family="Inter,Arial,sans-serif" font-size="23" fill="#1F2937">A redução de vegetação também modifica sombreamento e evapotranspiração.</text>
<text x="70" y="312" font-family="Inter,Arial,sans-serif" font-size="23" fill="#1F2937">Essas características contribuem para diferenças térmicas entre áreas da cidade.</text>
<text x="70" y="350" font-family="Inter,Arial,sans-serif" font-size="23" fill="#1F2937">A intensidade do fenômeno varia conforme clima, horário e características locais.</text>
<rect x="70" y="380" width="1060" height="114" rx="14" fill="#FFFFFF" stroke="#D9DEE7"/>
<text x="94" y="414" font-family="Manrope,Arial,sans-serif" font-size="22" font-weight="800" fill="#D6B35A">Síntese conceitual</text>
<text x="94" y="448" font-family="Inter,Arial,sans-serif" font-size="20" fill="#1F2937">A análise do clima urbano precisa considerar materiais, cobertura vegetal,</text>
<text x="94" y="480" font-family="Inter,Arial,sans-serif" font-size="20" fill="#1F2937">circulação do ar e uso do solo de forma integrada.</text>
<text x="70" y="704" font-family="Inter,Arial,sans-serif" font-size="15" fill="#52606F">Material demonstrativo autoral — Portfólio de Cleber Lisboa</text>
</svg>