<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="100%" height="100%" fill="#F7F7F3"/>
<rect x="34" y="30" width="1132" height="700" rx="18" fill="none" stroke="#D9DEE7" stroke-width="2"/>
<text x="70" y="82" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#D6B35A">DEMONSTRAÇÃO AUTORAL</text>
<text x="70" y="132" font-family="Manrope,Arial,sans-serif" font-size="38" font-weight="800" fill="#1F2937">Diagnóstico e intervenção urbana</text>
<text x="70" y="168" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#42D3AA">Conteúdo contínuo, com relações pouco visíveis</text>
<line x1="70" y1="190" x2="1130" y2="190" stroke="#D9DEE7" stroke-width="2"/>
<text x="70" y="236" font-family="Inter,Arial,sans-serif" font-size="23" fill="#1F2937">O diagnóstico urbano envolve diferentes tipos de informação e precisa considerar</text>
<text x="70" y="274" font-family="Inter,Arial,sans-serif" font-size="23" fill="#1F2937">temperatura, vegetação, materiais, circulação, uso do espaço, permanência de pessoas,</text>
<text x="70" y="312" font-family="Inter,Arial,sans-serif" font-size="23" fill="#1F2937">condições socioambientais, manutenção, infraestrutura e formas de acompanhamento.</text>
<text x="70" y="350" font-family="Inter,Arial,sans-serif" font-size="23" fill="#1F2937">Depois da intervenção, é necessário observar seus efeitos e comparar os resultados</text>
<text x="70" y="388" font-family="Inter,Arial,sans-serif" font-size="23" fill="#1F2937">com os objetivos definidos anteriormente.</text>
<rect x="70" y="418" width="1060" height="80" rx="14" fill="#FFFFFF" stroke="#D9DEE7"/>
<text x="94" y="452" font-family="Manrope,Arial,sans-serif" font-size="22" font-weight="800" fill="#D6B35A">Problema editorial</text>
<text x="94" y="486" font-family="Inter,Arial,sans-serif" font-size="20" fill="#1F2937">As etapas estão presentes, mas aparecem misturadas em um único bloco expositivo.</text>
<text x="70" y="704" font-family="Inter,Arial,sans-serif" font-size="15" fill="#52606F">Material demonstrativo autoral — Portfólio de Cleber Lisboa</text>
</svg>