<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="100%" height="100%" fill="#0F1623"/>
<rect x="34" y="30" width="1132" height="700" rx="18" fill="none" stroke="#2B3546" stroke-width="2"/>
<text x="70" y="82" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#D6B35A">DEMONSTRAÇÃO AUTORAL</text>
<text x="70" y="132" font-family="Manrope,Arial,sans-serif" font-size="38" font-weight="800" fill="#F5F6F8">Do diagnóstico à avaliação</text>
<text x="70" y="168" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#42D3AA">Reorganização que torna a progressão explícita</text>
<line x1="70" y1="190" x2="1130" y2="190" stroke="#2B3546" stroke-width="2"/>
<rect x="70" y="228" width="1060" height="80" rx="14" fill="#172131" stroke="#2B3546"/>
<text x="94" y="262" font-family="Manrope,Arial,sans-serif" font-size="22" font-weight="800" fill="#D6B35A">01 · Diagnosticar</text>
<text x="94" y="296" font-family="Inter,Arial,sans-serif" font-size="20" fill="#F5F6F8">Identificar condições térmicas, usos do espaço e grupos mais expostos.</text>
<rect x="70" y="326" width="1060" height="80" rx="14" fill="#172131" stroke="#2B3546"/>
<text x="94" y="360" font-family="Manrope,Arial,sans-serif" font-size="22" font-weight="800" fill="#D6B35A">02 · Priorizar</text>
<text x="94" y="394" font-family="Inter,Arial,sans-serif" font-size="20" fill="#F5F6F8">Definir critérios para comparar necessidades e selecionar uma intervenção.</text>
<rect x="70" y="424" width="1060" height="80" rx="14" fill="#172131" stroke="#2B3546"/>
<text x="94" y="458" font-family="Manrope,Arial,sans-serif" font-size="22" font-weight="800" fill="#D6B35A">03 · Intervir</text>
<text x="94" y="492" font-family="Inter,Arial,sans-serif" font-size="20" fill="#F5F6F8">Relacionar solução, viabilidade, manutenção e objetivos observáveis.</text>
<rect x="70" y="522" width="1060" height="80" rx="14" fill="#172131" stroke="#2B3546"/>
<text x="94" y="556" font-family="Manrope,Arial,sans-serif" font-size="22" font-weight="800" fill="#D6B35A">04 · Avaliar</text>
<text x="94" y="590" font-family="Inter,Arial,sans-serif" font-size="20" fill="#F5F6F8">Verificar resultados e revisar decisões com base em evidências.</text>
<text x="70" y="704" font-family="Inter,Arial,sans-serif" font-size="15" fill="#AAB2C0">Material demonstrativo autoral — Portfólio de Cleber Lisboa</text>
</svg>