<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="100%" height="100%" fill="#F7F7F3"/>
<rect x="34" y="30" width="1132" height="700" rx="18" fill="none" stroke="#D9DEE7" stroke-width="2"/>
<text x="70" y="82" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#D6B35A">DEMONSTRAÇÃO AUTORAL</text>
<text x="70" y="132" font-family="Manrope,Arial,sans-serif" font-size="38" font-weight="800" fill="#1F2937">Vegetação e conforto térmico</text>
<text x="70" y="168" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#42D3AA">Formulação genérica que precisa de maior precisão</text>
<line x1="70" y1="190" x2="1130" y2="190" stroke="#D9DEE7" stroke-width="2"/>
<text x="70" y="236" font-family="Inter,Arial,sans-serif" font-size="23" fill="#1F2937">Locais com muito concreto ficam mais quentes e, por isso, devem receber mais árvores.</text>
<text x="70" y="274" font-family="Inter,Arial,sans-serif" font-size="23" fill="#1F2937">A vegetação sempre reduz a temperatura e melhora automaticamente o conforto das pessoas.</text>
<text x="70" y="312" font-family="Inter,Arial,sans-serif" font-size="23" fill="#1F2937">Assim, plantar árvores é a principal solução para qualquer área urbana muito aquecida.</text>
<rect x="70" y="342" width="1060" height="114" rx="14" fill="#FFFFFF" stroke="#D9DEE7"/>
<text x="94" y="376" font-family="Manrope,Arial,sans-serif" font-size="22" font-weight="800" fill="#D6B35A">Ponto de atenção</text>
<text x="94" y="410" font-family="Inter,Arial,sans-serif" font-size="20" fill="#1F2937">A redação simplifica relações que dependem de contexto, espécie, sombreamento,</text>
<text x="94" y="442" font-family="Inter,Arial,sans-serif" font-size="20" fill="#1F2937">disponibilidade de água, ventilação, uso do espaço e condições de manutenção.</text>
<text x="70" y="704" font-family="Inter,Arial,sans-serif" font-size="15" fill="#52606F">Material demonstrativo autoral — Portfólio de Cleber Lisboa</text>
</svg>